<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add User</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; background: #f3f8f3; color: #18321f; }
    main { width: 100%; max-width: 380px; padding: 2rem; background: #fff; border: 1px solid #dce9dc; border-radius: 12px; }
    h1 { margin: 0 0 1.5rem; color: #237a3b; text-align: center; }
    label { display: block; margin: 1rem 0 0.4rem; font-weight: 600; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #c9d8ca; border-radius: 6px; font-size: 1rem; }
    input:focus { outline: 2px solid #78b887; border-color: #237a3b; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.8rem; border: 0; border-radius: 6px; background: #278542; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d6b34; }
    button:disabled { opacity: 0.7; cursor: wait; }
    #status { min-height: 1.25rem; margin: 1rem 0 0; text-align: center; }
    #status.success { color: #237a3b; }
    #status.error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Add User</h1>
    <form id="user-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required />
      <button id="submit-button" type="submit">Add User</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('user-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      status.className = '';
      button.disabled = true;
      button.textContent = 'Adding...';

      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.elements.email.value,
            password: form.elements.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || 'Unable to add user.');
        }
        form.reset();
        status.textContent = 'User added.';
        status.className = 'success';
      } catch (error) {
        status.textContent = error.message || 'Unable to connect to the server.';
        status.className = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'Add User';
      }
    });
  </script>
</body>
</html>
